name: CI / Publish

on:
  push:
    branches: [main]
    tags:
      # Prefer semver tags: v0.0.15, v1.2.3, …
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # 1 · Static analysis
  # ════════════════════════════════════════════════════════════════════════════
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ════════════════════════════════════════════════════════════════════════════
  # 2 · Package tests
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Test
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  # ════════════════════════════════════════════════════════════════════════════
  # 3 · Publish to pub.dev  (semver tag pushes only, after tests pass)
  #
  # One-time setup required:
  #   pub.dev → package → Settings → "Automated publishing"
  #   → add this GitHub repo + environment name "pub.dev"
  #
  # Tag example (must match pubspec version 0.0.15):
  #   git tag v0.0.15 && git push origin v0.0.15
  # ════════════════════════════════════════════════════════════════════════════
  publish:
    name: Publish to pub.dev
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pub.dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Verify tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          echo "tag=$TAG pubspec=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pubspec version $VERSION"
            exit 1
          fi

      - name: Dry-run
        run: flutter pub publish --dry-run

      - name: Publish
        run: flutter pub publish --force
